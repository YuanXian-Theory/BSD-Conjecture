name = "YXT-BSD"
version = "0.1.0"
packagesDir = ".lake/packages"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "master"

[leanOptions]
autoImplicit = true
relaxed = true

[[lean_exe]]
name = "bsd_proof"
root = "YXT.BSD"

[[lean_lib]]
name = "YXT"
srcDir = "."
globs = ["YXT.*"]
